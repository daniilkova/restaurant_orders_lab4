# helm repo add jetstack https://charts.jetstack.io
# helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set crds.enabled=true
#
# 1) Локальный стенд (restaurant.local): Let's Encrypt не выдаёт сертификаты для .local и
#    недоступных из интернета адресов, поэтому создаём собственный CA:
#    selfsigned -> корневой сертификат restaurant-root-ca -> ClusterIssuer restaurant-ca.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: restaurant-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Restaurant Dev Root CA
  secretName: restaurant-root-ca
  duration: 87600h            # 10 лет
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: restaurant-ca
spec:
  ca:
    secretName: restaurant-root-ca
---
# 2) Production: Let's Encrypt, проверка владения доменом через HTTP-01 (ingress-nginx).
#    Сначала staging (без жёстких лимитов), после проверки — prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@restaurant.example.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@restaurant.example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

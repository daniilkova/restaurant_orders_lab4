# Адрес S3-шлюза SeaweedFS для приложения. Имя сервиса проверьте командой:
#   kubectl get svc -n fastapi-app | grep 8333
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-config
  namespace: fastapi-app
data:
  S3_ENDPOINT: "http://seaweedfs-s3:8333"
  S3_BUCKET: "fastapi-files"
  S3_REGION: "us-east-1"

{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    {{- include "platform.syncWave" (list . "config") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ required "secrets.databaseUser обязателен" $s.databaseUser | quote }}
  DATABASE_PASSWORD: {{ required "secrets.databasePassword обязателен" $s.databasePassword | quote }}
  RABBITMQ_USER: {{ $s.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ $s.rabbitmqPassword | quote }}
  CELERY_BROKER_URL: {{ printf "amqp://%s:%s@rabbitmq:5672//" $s.rabbitmqUser $s.rabbitmqPassword | quote }}
  ADMIN_USERNAME: {{ $s.adminUsername | quote }}
  ADMIN_PASSWORD: {{ $s.adminPassword | quote }}
  SECRET_KEY: {{ $s.secretKey | quote }}
  BOOTSTRAP_ADMIN_USERNAME: {{ $s.bootstrapAdminUsername | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ $s.bootstrapAdminPassword | quote }}
  METRICS_TOKEN: {{ $s.metricsToken | quote }}
{{- end }}
{{- if and (eq .Values.database.mode "cnpg") (not .Values.security.vault.enabled) }}
{{- $s := .Values.secrets }}
---
# Логин и пароль владельца БД для bootstrap кластера CloudNativePG
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.cnpg.clusterName }}-credentials
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    {{- include "platform.syncWave" (list . "config") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $s.databaseUser | quote }}
  password: {{ $s.databasePassword | quote }}
{{- end }}

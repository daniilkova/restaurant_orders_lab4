replicaCount: 2
image:
  repository: restaurant-frontend
  tag: "0.9.0"
  pullPolicy: IfNotPresent
service:
  port: 80
containerPort: 8080
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 200m, memory: 64Mi}

ingress:
  enabled: true
  className: nginx
  host: app.example.com
  tls:
    enabled: true
    secretName: restaurant-tls
    clusterIssuer: restaurant-ca          # production: letsencrypt-prod
  # Маршрут /api -> FastAPI тоже публикуется этим чартом (единый домен)
  api:
    serviceName: api
    servicePort: http
    rateLimitRpm: 100
    authRateLimitRpm: 5

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

canary:
  enabled: false
  weight: 10
  header: X-Canary
  headerValue: always
  replicaCount: 1
  image:
    tag: "0.9.1"

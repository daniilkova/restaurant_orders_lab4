{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-frontend
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ $ing.tls.enabled | quote }}
    {{- if $ing.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $ing.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  {{- include "frontend.tls" . | nindent 2 }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontend.fullname" . }}-service
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-api
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ $ing.tls.enabled | quote }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/limit-rpm: {{ $ing.api.rateLimitRpm | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-cookie-path: "/auth/refresh /api/auth/refresh"
spec:
  ingressClassName: {{ $ing.className }}
  {{- include "frontend.tls" . | nindent 2 }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $ing.api.serviceName }}
                port:
                  name: {{ $ing.api.servicePort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-api-auth
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ $ing.tls.enabled | quote }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /auth/$2
    nginx.ingress.kubernetes.io/limit-rpm: {{ $ing.api.authRateLimitRpm | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
    nginx.ingress.kubernetes.io/proxy-cookie-path: "/auth/refresh /api/auth/refresh"
spec:
  ingressClassName: {{ $ing.className }}
  {{- include "frontend.tls" . | nindent 2 }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $ing.api.serviceName }}
                port:
                  name: {{ $ing.api.servicePort }}
{{- end }}

{{- if .Values.canary.enabled }}
{{- $c := .Values.canary }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend.fullname" . }}-canary
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    track: canary
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" (dict "track" "canary") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" (dict "track" "canary") | nindent 8 }}
    spec:
      {{- include "frontend.podSpec" (dict "root" . "tag" $c.image.tag) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend.fullname" . }}-canary
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "frontend.selectorLabels" (dict "track" "canary") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-frontend-canary
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ $c.weight | quote }}
    nginx.ingress.kubernetes.io/canary-by-header: {{ $c.header }}
    nginx.ingress.kubernetes.io/canary-by-header-value: {{ $c.headerValue }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontend.fullname" . }}-canary
                port:
                  name: http
{{- end }}

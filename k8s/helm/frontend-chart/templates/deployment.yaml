apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    track: stable
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" (dict "track" "stable") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" (dict "track" "stable") | nindent 8 }}
    spec:
      {{- include "frontend.podSpec" (dict "root" . "tag" .Values.image.tag) | nindent 6 }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: fastapi-app
  labels:
    app: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      serviceAccountName: celery-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flower
          image: restaurant-worker:0.5.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["sh", "-c", "celery -A app.celery_app flower --port=5555 --basic-auth=$ADMIN_USERNAME:$ADMIN_PASSWORD"]
          ports:
            - containerPort: 5555
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: fastapi-app
  labels:
    app: flower
spec:
  selector:
    app: flower
  ports:
    - name: http
      port: 5555
      targetPort: http

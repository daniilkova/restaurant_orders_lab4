# /api/auth — 5 запросов в минуту с IP (подбор паролей, массовые регистрации).
# ingress-nginx выбирает самый длинный совпавший префикс, поэтому /api/auth/token попадает сюда,
# а не в общий /api. При превышении лимита ingress-nginx отвечает 503 (limit-req-status-code по умолчанию).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-api-auth
  namespace: fastapi-app
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /auth/$2
    nginx.ingress.kubernetes.io/limit-rpm: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
    nginx.ingress.kubernetes.io/proxy-cookie-path: "/auth/refresh /api/auth/refresh"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.example.com]
      secretName: restaurant-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  name: http

# Canary-релиз фронтенда через ingress-nginx.
# 1) 10% трафика на новую версию; 2) заголовок X-Canary: always — всегда canary (для тестировщиков);
# 3) постепенно: kubectl annotate ingress restaurant-frontend-canary -n fastapi-app \
#      nginx.ingress.kubernetes.io/canary-weight="50" --overwrite   (затем 100);
# 4) откат — kubectl delete -f k8s/frontend/canary/ (весь трафик снова на stable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
  namespace: fastapi-app
  labels:
    app: frontend
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      track: canary
  template:
    metadata:
      labels:
        app: frontend
        track: canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: restaurant-frontend:0.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  namespace: fastapi-app
spec:
  selector:
    app: frontend
    track: canary
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Тот же host и path, что у основного Ingress: ingress-nginx объединяет их в один location
# и делит трафик по весу. С другим host/path это был бы просто второй сайт, а не canary.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-frontend-canary
  namespace: fastapi-app
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: X-Canary
    nginx.ingress.kubernetes.io/canary-by-header-value: always
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-canary
                port:
                  name: http

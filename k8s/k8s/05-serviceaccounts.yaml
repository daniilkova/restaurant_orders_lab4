# Отдельный ServiceAccount на каждый компонент (least privilege). Приложению не нужен доступ
# к Kubernetes API, поэтому токен в поды не монтируется и Role/RoleBinding не выдаются.
# fastapi-sa используется и для входа Vault Secrets Operator в Vault (роль fastapi-role).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-sa
  namespace: fastapi-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celery-sa
  namespace: fastapi-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-sa
  namespace: fastapi-app
automountServiceAccountToken: false

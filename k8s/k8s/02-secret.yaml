# Учебные значения. Secret хранится в etcd в base64 (это кодирование, не шифрование),
# поэтому в Git настоящие пароли не кладут. С ЛР5 этот Secret создаёт Vault Secrets Operator
# из Vault (k8s/vault/02-static-secret.yaml); файл оставлен для запуска без Vault.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: fastapi-app
  labels:
    app.kubernetes.io/part-of: restaurant
type: Opaque
stringData:
  DATABASE_USER: "restaurant"
  DATABASE_PASSWORD: "restaurant-pass"
  RABBITMQ_USER: "restaurant"
  RABBITMQ_PASSWORD: "rabbit-pass"
  CELERY_BROKER_URL: "amqp://restaurant:rabbit-pass@rabbitmq:5672//"
  ADMIN_USERNAME: "staff"          # HTTP Basic для /dashboard и Flower
  ADMIN_PASSWORD: "staff-pass"
  SECRET_KEY: "change-me-in-production-at-least-32-bytes"
  BOOTSTRAP_ADMIN_USERNAME: "admin"
  BOOTSTRAP_ADMIN_PASSWORD: "Admin12345"
  METRICS_TOKEN: "change-me-metrics-token"

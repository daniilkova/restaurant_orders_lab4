# Динамические учётные данные PostgreSQL: Vault (database secrets engine) создаёт отдельного
# пользователя БД с TTL 1 ч, VSO продлевает аренду, а перед истечением получает новую пару
# и перезапускает поды. Утёкший пароль живёт не дольше часа и привязан к аренде (её можно отозвать).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: app-db-credentials
  namespace: fastapi-app
spec:
  vaultAuthRef: vault-auth
  mount: database
  path: creds/restaurant-app
  renewalPercent: 67
  revoke: true                 # при удалении ресурса пользователь БД удаляется
  destination:
    name: app-db-credentials
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        DATABASE_USER:
          text: '{{ get .Secrets "username" }}'
        DATABASE_PASSWORD:
          text: '{{ get .Secrets "password" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: api
    - kind: Deployment
      name: celery-worker

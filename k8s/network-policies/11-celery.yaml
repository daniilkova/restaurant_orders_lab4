apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celery-worker-egress
  namespace: fastapi-app
  annotations:
    description: 'Воркер: PostgreSQL (статусы заказов) и RabbitMQ; входящих соединений нет'
spec:
  podSelector:
    matchLabels:
      app: celery-worker
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    - podSelector:
        matchLabels:
          cnpg.io/cluster: restaurant-db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flower
  namespace: fastapi-app
  annotations:
    description: 'Flower: метрики забирает Prometheus, сам ходит только в RabbitMQ'
spec:
  podSelector:
    matchLabels:
      app: flower
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 5555
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq
    ports:
    - protocol: TCP
      port: 5672

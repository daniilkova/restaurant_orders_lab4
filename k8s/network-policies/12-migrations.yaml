apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-migrate-egress
  namespace: fastapi-app
  annotations:
    description: Job миграций — только PostgreSQL
spec:
  podSelector:
    matchLabels:
      app: db-migrate
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    - podSelector:
        matchLabels:
          cnpg.io/cluster: restaurant-db
    ports:
    - protocol: TCP
      port: 5432

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  namespace: fastapi-app
  annotations:
    description: 'SeaweedFS: S3 для API, связь компонентов между собой и с оператором'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 8333
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: seaweedfs-system
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9327
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs

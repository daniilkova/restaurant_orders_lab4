# Статические секреты приложения: SECRET_KEY (подпись JWT), пароль RabbitMQ, служебные учётки.
# VSO создаёт и обновляет Secret app-secret (вместо k8s/02-secret.yaml из Git) и при изменении
# в Vault перезапускает поды, чтобы они прочитали новые значения.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-secret
  namespace: fastapi-app
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: fastapi/config
  refreshAfter: 30s
  destination:
    name: app-secret
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: api
    - kind: Deployment
      name: celery-worker
    - kind: Deployment
      name: flower

# Общие настройки проксирования на FastAPI (/etc/nginx/snippets/restaurant-proxy.conf)
proxy_pass http://restaurant_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Nginx ПЕРЕЗАПИСЫВАЕТ заголовки реальным адресом: значение, присланное клиентом, не доходит до API
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# refresh-cookie выдаётся с Path=/auth/refresh, а браузер обращается к /api/auth/refresh
proxy_cookie_path /auth/refresh /api/auth/refresh;
proxy_read_timeout 30s;
client_max_body_size 10m;

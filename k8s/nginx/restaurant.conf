# Локальный reverse proxy (альтернатива Cloudflare): статика фронтенда + API на одном домене.
#   npm --prefix frontend-app run build
#   sudo cp nginx/restaurant.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo nginx -s reload
# Бэкенд: uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1
#         CLIENT_IP_HEADER=X-Real-IP COOKIE_SECURE=true (для HTTPS-блока ниже)

# $binary_remote_addr — 4 байта на IPv4 (16 на IPv6) вместо строки до 39 символов: в зону 10 МБ
# помещается ~160 тыс. адресов
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_status 429;

upstream restaurant_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost restaurant.local;
    # HTTP -> HTTPS (если включён блок 443 ниже)
    # return 308 https://$host$request_uri;

    root /var/www/restaurant/dist;     # содержимое frontend-app/dist
    index index.html;

    # Строгий лимит на вход и регистрацию: защита от подбора паролей и массовых регистраций
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        rewrite ^/api/(.*)$ /$1 break;   # у FastAPI нет префикса /api
        include /etc/nginx/snippets/restaurant-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/restaurant-proxy.conf;
    }

    # Хэшированные файлы сборки Vite не меняются — кэшируем на год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /account, /dishes/3 и т.п. отдаёт index.html, маршрут разбирает Vue Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Самоподписанный сертификат для локальной проверки HTTPS (Secure-cookies, HSTS):
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=restaurant.local" \

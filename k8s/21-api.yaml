apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fastapi-app
  labels:
    app: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # обновление без простоя: старый под гасится после готовности нового
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: restaurant-api:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LOG_FORMAT
              value: json
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
            - configMapRef:
                name: s3-config
                optional: true       # до ЛР4 (без SeaweedFS) под стартует и без S3
            - secretRef:
                name: s3-credentials
                optional: true
          startupProbe:          # даём приложению до 60 с на старт, пока liveness не включилась
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fastapi-app
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http

# Production-приложение с Argo CD Image Updater.
# Image Updater следит за реестром ghcr.io, находит новый тег по стратегии semver
# (только патч-версии 0.3.x — узкое ограничение для production) и коммитит его
# в helm/fastapi-platform/values-prod.yaml (git write-back). Дальше Argo CD
# синхронизирует кластер с Git как обычно — Git остаётся единственным источником истины.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restaurant-platform-prod
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      api=ghcr.io/student/restaurant-api:~0.3,
      worker=ghcr.io/student/restaurant-worker:~0.3
    argocd-image-updater.argoproj.io/api.update-strategy: semver
    argocd-image-updater.argoproj.io/api.helm.image-name: api.image.repository
    argocd-image-updater.argoproj.io/api.helm.image-tag: api.image.tag
    argocd-image-updater.argoproj.io/worker.update-strategy: semver
    argocd-image-updater.argoproj.io/worker.helm.image-name: worker.image.repository
    argocd-image-updater.argoproj.io/worker.helm.image-tag: worker.image.tag
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:/helm/fastapi-platform/values-prod.yaml
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/student/restaurant-platform.git
    targetRevision: main
    path: helm/fastapi-platform
    helm:
      releaseName: restaurant
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi-prod
  syncPolicy:
    # метки Pod Security Standards на namespace, который создаёт Argo CD (CreateNamespace=true)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: celery-worker
      jsonPointers:
        - /spec/replicas

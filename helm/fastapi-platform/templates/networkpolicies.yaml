{{- if .Values.security.networkPolicies.enabled }}
{{- $np := .Values.security.networkPolicies }}
{{- $cnpg := eq .Values.database.mode "cnpg" }}
{{- $pgSelector := ternary (printf "cnpg.io/cluster: %s" .Values.database.cnpg.clusterName) "app: postgres" $cnpg }}
# Default deny: запрещено всё, что не разрешено явно ниже
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels: { {{ $pgSelector }} }
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels: {app: redis}
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - podSelector:
            matchLabels: {app: rabbitmq}
      ports:
        - {protocol: TCP, port: 5672}
    {{- if .Values.seaweedfs.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: seaweedfs}
      ports:
        - {protocol: TCP, port: 8333}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celery-worker
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: celery-worker}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: { {{ $pgSelector }} }
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels: {app: rabbitmq}
      ports:
        - {protocol: TCP, port: 5672}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flower
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: flower}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 5555}
  egress:
    - to:
        - podSelector:
            matchLabels: {app: rabbitmq}
      ports:
        - {protocol: TCP, port: 5672}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-migrate
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: db-migrate}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { {{ $pgSelector }} }
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { {{ $pgSelector }} }
  policyTypes: [Ingress{{ if $cnpg }}, Egress{{ end }}]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {app: celery-worker}
        - podSelector:
            matchLabels: {app: db-migrate}
      ports:
        - {protocol: TCP, port: 5432}
    {{- if $cnpg }}
    - from:
        - podSelector:
            matchLabels: { {{ $pgSelector }} }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 9187}
  egress:
    - to:
        - podSelector:
            matchLabels: { {{ $pgSelector }} }
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
    # Kubernetes API (instance manager CloudNativePG) и S3 для резервных копий
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9000}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {app: celery-worker}
        - podSelector:
            matchLabels: {app: flower}
      ports:
        - {protocol: TCP, port: 5672}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.kedaNamespace }}
      ports:
        - {protocol: TCP, port: 5672}
        - {protocol: TCP, port: 15672}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 15692}
{{- if .Values.seaweedfs.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: seaweedfs}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - {protocol: TCP, port: 8333}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: seaweedfs}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs-system
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: seaweedfs}
{{- end }}
{{- end }}

{{- if eq .Values.database.mode "cnpg" }}
{{- $c := .Values.database.cnpg }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $c.clusterName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    {{- include "platform.syncWave" (list . "infra") | nindent 4 }}
spec:
  instances: {{ $c.instances }}
  imageName: {{ $c.imageName }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.secrets.databaseUser }}
      secret:
        name: {{ $c.clusterName }}-credentials
  storage:
    size: {{ $c.storage }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  {{- if $c.backup.enabled }}
  backup:
    retentionPolicy: {{ $c.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ $c.backup.destinationPath }}
      endpointURL: {{ $c.backup.endpointURL }}
      s3Credentials:
        accessKeyId:
          name: {{ $c.backup.credentialsSecret }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $c.backup.credentialsSecret }}
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
{{- if $c.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $c.clusterName }}-daily
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    {{- include "platform.syncWave" (list . "autoscaling") | nindent 4 }}
spec:
  schedule: {{ $c.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: true
  cluster:
    name: {{ $c.clusterName }}
{{- end }}
{{- end }}

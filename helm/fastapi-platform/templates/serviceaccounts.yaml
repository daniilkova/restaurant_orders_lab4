{{- /* Свой ServiceAccount на компонент; токен API в поды не монтируется (приложению не нужен доступ к Kubernetes API) */}}
{{- range $name := list "fastapi-sa" "celery-sa" "infra-sa" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
  annotations:
    {{- include "platform.syncWave" (list $ "config") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

# Проверка политики: kubectl apply -f security/kyverno/test-privileged-pod.yaml
# Ожидается отказ: «admission webhook "validate.kyverno.svc-fail" denied the request ...»
apiVersion: v1
kind: Pod
metadata:
  name: privileged-test
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true

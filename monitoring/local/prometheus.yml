# Prometheus для docker compose (в Kubernetes цели задают ServiceMonitor'ы)
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.rules.yml
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"], labels: {namespace: fastapi-app}}]
  - job_name: flower
    basic_auth: {username: admin, password: secret}
    static_configs: [{targets: ["flower:5555"]}]
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params: {family: [queue_coarse_metrics]}
    static_configs: [{targets: ["rabbitmq:15692"]}]

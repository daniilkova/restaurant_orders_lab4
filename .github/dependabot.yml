# Обновления закреплённых по SHA actions, зависимостей Python и базовых образов — через PR с ревью
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
